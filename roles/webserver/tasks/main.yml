---
- name: Install nginx
  dnf:
    name: nginx
    state: present

- name: Deploy nginx config
  copy:
    dest: /etc/nginx/nginx.conf
    content: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log;
      pid /run/nginx.pid;
      events { worker_connections 1024; }
      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        log_format main '$remote_addr - $remote_user [$time_local] "$request"';
        access_log /var/log/nginx/access.log main;
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          location /health { return 200 'ok'; add_header Content-Type text/plain; }
        }
      }
  notify: Restart nginx

- name: Deploy index.html
  copy:
    dest: /usr/share/nginx/html/index.html
    content: |
      <html><body>
      <h1>Configured by Ansible - {{ inventory_hostname }}</h1>
      <p>Project: sravani-devops | Env: dev</p>
      <p>Date: {{ ansible_date_time.iso8601 }}</p>
      </body></html>
  notify: Restart nginx

- name: Ensure firewalld is running
  systemd:
    name: firewalld
    state: started
    enabled: true
  ignore_errors: true

- name: Open http/https in firewalld
  firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
  ignore_errors: true

- name: Open app port 8080 in firewalld
  firewalld:
    port: 8080/tcp
    permanent: true
    immediate: true
    state: enabled
  ignore_errors: true
